<!-- templates/detail.html -->
{% extends "base.html" %}

{% block content %}
<h1>Entry Details</h1>

<p><strong>Date:</strong> {{ entry.date }}</p>
<p><strong>Gym:</strong> {{ "Yes" if entry.gym else "No" }}</p>
<p><strong>Water:</strong> {{ entry.water }}</p>
<p><strong>Healthy Food:</strong> {{ "Yes" if entry.healthy_food else "No" }}</p>
<p><strong>Notes:</strong> {{ entry.notes }}</p>

<a href="{{ url_for('home') }}">Back</a>
<a href="{{ url_for('edit_entry', entry_id=entry.id) }}">Edit</a>
{% endblock %}
